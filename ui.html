<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Candle Record</title>
<style>
  :root{
    --bg:#07111f; --bg2:#0c1930; --text:#eff7ff; --muted:#9eb2cc;
    --glass:rgba(255,255,255,.07); --border:rgba(170,210,255,.14);
    --ice:#8fd3ff; --ice2:#c7eaff; --lav:#b7b2ff; --danger:#ff7b93;
    --ok:#8ee7c6;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none}
  html, body{
    font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    color:var(--text); min-height:100vh; overflow:hidden; user-select:none;
    background: #07111f;
  }
  .scene{position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:20px;}
  .aurora{
    position:absolute;inset:-20%;filter:blur(40px);opacity:.45;
    background:
      radial-gradient(ellipse at 30% 30%, rgba(120,220,255,.22), transparent 35%),
      radial-gradient(ellipse at 70% 25%, rgba(170,160,255,.18), transparent 30%),
      radial-gradient(ellipse at 55% 60%, rgba(120,255,220,.08), transparent 35%);
    animation:aurora 14s ease-in-out infinite alternate;
  }
  @keyframes aurora{from{transform:translateY(0) scale(1)}to{transform:translateY(-20px) scale(1.03)}}
  .snow, .snow:before, .snow:after{
    position:absolute;top:-600px;left:0;right:0;bottom:0;
    background-image:
      radial-gradient(2px 2px at 20px 30px, rgba(255,255,255,.9) 50%, transparent 51%),
      radial-gradient(2px 2px at 100px 80px, rgba(255,255,255,.7) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 160px 120px, rgba(255,255,255,.8) 50%, transparent 51%),
      radial-gradient(2px 2px at 60px 170px, rgba(255,255,255,.6) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 200px 40px, rgba(255,255,255,.75) 50%, transparent 51%),
      radial-gradient(2.5px 2.5px at 250px 150px, rgba(255,255,255,.55) 50%, transparent 51%);
    background-size:300px 300px;
    animation:snowFall 18s linear infinite; opacity:.35;
  }
  .snow:before{content:"";opacity:.45;filter:blur(.3px);animation-duration:24s;background-position:120px 60px;transform:scale(1.2);}
  .snow:after{content:"";opacity:.25;filter:blur(1px);animation-duration:32s;background-position:60px 120px;transform:scale(1.5);}
  @keyframes snowFall{from{transform:translateY(0)}to{transform:translateY(600px)}}

  .app{
    position:relative;z-index:1;height:100vh;padding:14px 24px 20px;display:flex;flex-direction:column;gap:12px;
    animation:enter .55s ease-out;
    border-radius:18px; overflow:auto;
    background:
      radial-gradient(1000px 600px at 15% -10%, rgba(120,190,255,.22), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(180,170,255,.16), transparent 55%),
      radial-gradient(800px 500px at 50% 120%, rgba(140,220,255,.12), transparent 55%),
      linear-gradient(180deg,#0a1628 0%, #07111f 45%, #050d19 100%);
  }
  .titlebar{display:flex;align-items:center;justify-content:space-between;height:34px;flex:0 0 auto;}
  .traffic{display:flex;align-items:center;gap:9px;padding-left:2px;}
  .tbtn{
    width:13px;height:13px;border-radius:50%;border:0;padding:0;cursor:pointer;position:relative;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.12); transition:filter .15s, transform .15s;
  }
  .tbtn:hover{filter:brightness(1.08);transform:scale(1.05)}
  .tbtn:active{transform:scale(.96)}
  .tbtn::after{content:"";position:absolute;inset:0;display:grid;place-items:center;opacity:0;transition:.12s;
    font-size:9px;font-weight:900;line-height:13px;color:rgba(0,0,0,.55);font-family:system-ui;}
  .traffic:hover .tbtn::after{opacity:1}
  .tbtn.close{background:#ff5f57;} .tbtn.close::after{content:"×";font-size:11px;line-height:12px;}
  .tbtn.min{background:#febc2e;} .tbtn.min::after{content:"−";font-size:12px;line-height:11px;}
  .tbtn.max{background:#28c840;} .tbtn.max::after{content:"+";font-size:11px;line-height:12px;}
  .drag-region{flex:1;height:100%;}
  @keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  .top{display:flex;align-items:center;justify-content:flex-end;gap:16px;}
  .brand{display:flex;align-items:center;gap:14px;}
  .logo-wrap{
    width:54px;height:54px;border-radius:18px;padding:3px;
    background:linear-gradient(135deg,rgba(170,230,255,.9),rgba(140,150,255,.7),rgba(255,255,255,.5));
    box-shadow:0 10px 30px rgba(120,190,255,.28), 0 0 0 1px rgba(255,255,255,.12);
    position:relative;
  }
  .logo-wrap::after{
    content:"";position:absolute;inset:-6px;border-radius:22px;z-index:-1;
    background:radial-gradient(circle, rgba(160,220,255,.35), transparent 70%);filter:blur(4px);
  }
  .logo-img{
    width:100%;height:100%;border-radius:14px;object-fit:cover;display:block;background:#0d1a2d;
    -webkit-user-drag:none; user-drag:none; user-select:none; pointer-events:none;
  }
  .brand h1{font-size:1.8rem;font-weight:760;letter-spacing:-.03em;line-height:1;
    background:linear-gradient(180deg,#ffffff,#cfe8ff);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .brand p{color:var(--muted);font-size:.88rem;margin-top:5px}
  .chip{
    padding:9px 14px;border-radius:999px;font-size:.78rem;font-weight:650;color:#dff1ff;
    background:rgba(140,200,255,.1);border:1px solid rgba(160,215,255,.2);
    backdrop-filter:blur(10px);box-shadow:inset 0 1px 0 rgba(255,255,255,.08);
  }

  .main{flex:1;display:grid;grid-template-columns:1fr 290px;gap:20px;min-height:0;}
  @media (max-width:860px){.main{grid-template-columns:1fr}}

  .panel{
    background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.03));
    border:1px solid var(--border);border-radius:28px;
    backdrop-filter:blur(18px);box-shadow:0 25px 80px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.08);
    overflow:auto;position:relative;transition:border-color .4s, box-shadow .4s;
  }
  .panel::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(135deg,rgba(255,255,255,.09),transparent 30%,transparent 70%,rgba(170,220,255,.04));
  }
  .record-panel{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:14px;text-align:center;}
  .record-panel.recording{border-color:rgba(255,140,160,.25);box-shadow:0 25px 80px rgba(0,0,0,.35), 0 0 0 1px rgba(255,140,160,.08), 0 0 90px rgba(130,190,255,.08);}

  .ring-wrap{position:relative;width:210px;height:210px;display:grid;place-items:center;}
  .ring-glow{
    position:absolute;inset:-14px;border-radius:50%;opacity:.25;transition:.4s;
    background:conic-gradient(from 0deg,#8fd3ff,#dff4ff,#b7b2ff,#8fd3ff);
    filter:blur(20px);
  }
  .ring{
    position:absolute;inset:0;border-radius:50%;
    background:conic-gradient(from 0deg, rgba(160,220,255,.35), rgba(255,255,255,.12), rgba(180,170,255,.28), rgba(160,220,255,.35));
    transition:.4s;
  }
  .ring::before{content:"";position:absolute;inset:3px;border-radius:50%;background:linear-gradient(180deg,#13233d,#0d182b);}
  .recording .ring-glow{opacity:.5;background:radial-gradient(circle, rgba(255,140,160,.45), rgba(143,211,255,.15) 60%, transparent 72%);}
  .recording .ring{background:linear-gradient(135deg, rgba(255,150,170,.6), rgba(143,211,255,.5));}
  .recording .ring::before{inset:4px;}

  .ring-inner{
    position:relative;z-index:2;width:160px;height:160px;border-radius:50%;
    background:linear-gradient(180deg,rgba(30,50,80,.95),rgba(14,25,44,.96));
    border:1px solid rgba(180,220,255,.12);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.09), 0 20px 40px rgba(0,0,0,.25);
  }
  .timer{
    font-size:2.8rem;font-weight:760;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1;
    background:linear-gradient(180deg,#ffffff,#bcdcff);-webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .recording .timer{background:linear-gradient(180deg,#fff,#ffd0d8);-webkit-background-clip:text;background-clip:text;}
  .timer-sub{font-size:.76rem;color:#9fc0de;font-weight:700;letter-spacing:.14em;text-transform:uppercase;}

  .wave{display:flex;align-items:flex-end;gap:5px;height:28px;opacity:.3;transition:opacity .3s;}
  .wave i{
    display:block;width:4px;border-radius:4px;
    background:linear-gradient(180deg,#dff4ff,#8fd3ff);
    height:10px;opacity:.55;
  }
  .wave i:nth-child(2){height:16px}.wave i:nth-child(3){height:24px}
  .wave i:nth-child(4){height:30px}.wave i:nth-child(5){height:22px}
  .wave i:nth-child(6){height:14px}.wave i:nth-child(7){height:18px}
  .recording .wave{opacity:1}
  .recording .wave i{opacity:1}

  .rec-dot{display:flex;align-items:center;gap:8px;font-size:.8rem;font-weight:700;color:#ffb3c0;opacity:0;transform:translateY(6px);transition:.3s;}
  .rec-dot span{width:8px;height:8px;border-radius:50%;background:var(--danger);box-shadow:0 0 0 4px rgba(255,123,147,.18);}
  .recording .rec-dot{opacity:1;transform:translateY(0);}

  .status{min-height:24px;color:var(--muted);font-size:.95rem;transition:.3s;}
  .status.ok{color:var(--ok)} .status.err{color:#ff9caa}
  .actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;}
  .actions button{
    appearance:none;border:0;border-radius:16px;padding:14px 22px;font:inherit;font-weight:700;
    color:#082033;cursor:pointer;display:inline-flex;align-items:center;gap:10px;
    transition:transform .18s, box-shadow .18s, opacity .18s, filter .18s; position:relative;overflow:hidden;
  }
  .actions button:hover:not(:disabled){filter:brightness(1.06)}
  .actions button:active:not(:disabled){filter:brightness(.97)}
  .actions button:disabled{opacity:.45;cursor:not-allowed;filter:saturate(.5)}
  .actions button svg{width:18px;height:18px;fill:currentColor;flex:0 0 auto}
  .btn-start{
    color:#082033;background:#9fd8ff;
    box-shadow:0 8px 20px rgba(143,211,255,.22);
  }
  .btn-stop{
    color:#fff;background:#ff7b93;
    box-shadow:0 8px 20px rgba(255,123,147,.20);
  }
  .btn-ghost{
    color:#082033;background:#9fd8ff;border:1px solid transparent;
    box-shadow:0 8px 20px rgba(143,211,255,.22);
  }
  .btn-ghost:hover:not(:disabled){filter:brightness(1.06)}

  .side{padding:22px;display:flex;flex-direction:column;gap:14px;}
  .side h2{font-size:.8rem;text-transform:uppercase;letter-spacing:.14em;color:#9dc0de;margin-bottom:2px;}
  .stat{padding:14px;border-radius:16px;background:rgba(255,255,255,.045);border:1px solid rgba(170,210,255,.1);backdrop-filter:blur(10px);}
  .stat .k{font-size:.74rem;color:#bcd3ea;margin-bottom:6px;text-transform:uppercase;letter-spacing:.08em;font-weight:700}
  .stat .v{font-size:.96rem;font-weight:650;color:#f4faff;word-break:break-word}
  .stat .v.good{color:var(--ok)}
  .opt-group{display:flex;gap:8px;margin-top:2px;}
  .opt{
    flex:1; appearance:none; border:1px solid rgba(170,210,255,.14);
    background:rgba(8,16,30,.45); color:#dcecff; border-radius:10px;
    padding:10px 8px; font:inherit; font-size:.82rem; font-weight:700;
    cursor:pointer; transition:.18s; min-height:40px;
  }
  .opt:hover:not(:disabled){border-color:rgba(170,210,255,.32); background:rgba(255,255,255,.06); color:#fff;}
  .opt.active{
    background:rgba(143,211,255,.14); border-color:rgba(143,211,255,.55);
    color:#f4faff; box-shadow:inset 0 0 0 1px rgba(143,211,255,.18);
  }
  .opt:disabled{opacity:.45; cursor:not-allowed;}
  .audio-row{display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .switch{position:relative;display:inline-block;width:52px;height:30px;flex:0 0 auto;}
  .switch input{opacity:0;width:0;height:0;}
  .slider{
    position:absolute;cursor:pointer;inset:0;background:rgba(255,255,255,.12);
    border:1px solid rgba(170,210,255,.16);transition:.25s;border-radius:999px;
  }
  .slider:before{
    content:"";position:absolute;height:22px;width:22px;left:3px;top:3px;
    background:#fff;border-radius:50%;transition:.25s;box-shadow:0 2px 6px rgba(0,0,0,.25);
  }
  .switch input:checked + .slider{background:rgba(143,211,255,.35);border-color:rgba(143,211,255,.45);}
  .switch input:checked + .slider:before{transform:translateX(22px);background:#dff4ff;}
  .switch input:disabled + .slider{opacity:.5;cursor:not-allowed;}
  .file{
    margin-top:auto;padding:14px;border-radius:16px;background:rgba(143,211,255,.08);
    border:1px solid rgba(143,211,255,.14);
  }
  .file .k{font-size:.73rem;color:#b9dcf5;margin-bottom:5px;text-transform:uppercase;letter-spacing:.08em}
  .file .v{font-size:.84rem;color:#eaf6ff;word-break:break-all;line-height:1.4}
  .foot{color:#87a2bf;font-size:.76rem;text-align:center;display:flex;flex-direction:column;gap:4px;}
  .rainbow{
    font-weight:800;
    background:linear-gradient(90deg,#ff6b6b,#ffd93d,#6bff95,#6bcfff,#b28dff,#ff6bd6,#ff6b6b);
    background-size:200% auto;
    -webkit-background-clip:text;background-clip:text;color:transparent;
    animation:rainbow 3s linear infinite;
  }
  @keyframes rainbow{to{background-position:200% center}}
</style>
</head>
<body>
  <div class="scene">
    <div class="aurora"></div>
    <div class="snow"></div>
  </div>

  <div class="app">
    <div class="titlebar">
      <div class="traffic">
        <button class="tbtn close" title="Close" onclick="winCtrl('close')"></button>
        <button class="tbtn min" title="Minimize" onclick="winCtrl('minimize')"></button>
        <button class="tbtn max" title="Zoom (Right click: Fullscreen)" onclick="winCtrl('maximize')" oncontextmenu="event.preventDefault();winCtrl('fullscreen')"></button>
      </div>
      <div class="drag-region" id="dragRegion"></div>
    </div>
    <div class="top">
      <div class="chip">Screen Recorder</div>
    </div>

    <div class="main">
      <div class="panel record-panel" id="recordPanel">
        <div class="ring-wrap">
          <div class="ring-glow"></div>
          <div class="ring"></div>
          <div class="ring-inner">
            <div class="timer" id="timer">00:00</div>
            <div class="timer-sub" id="timerSub">Ready</div>
          </div>
        </div>

        <div class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <div class="rec-dot"><span></span> RECORDING</div>
        <div class="status" id="status">Your screen is ready to record.</div>

        <div class="actions">
          <button class="btn-start" id="startBtn" onclick="startRec()">Start Recording</button>
          <button class="btn-stop" id="stopBtn" onclick="stopRec()" disabled>Stop</button>
          <button class="btn-ghost" id="openBtn" onclick="openDownloads()">Open Downloads</button>
        </div>
      </div>

      <div class="panel side">
        <h2>Session</h2>
        <div class="stat"><div class="k">Status</div><div class="v" id="sideStatus">Idle</div></div>
        <div class="stat">
          <div class="k">Resolution</div>
          <div class="opt-group" id="resolutionSelect">
            <button class="opt active" data-value="native">Native</button>
            <button class="opt" data-value="1920x1080">1080p</button>
            <button class="opt" data-value="1280x720">720p</button>
          </div>
        </div>
        <div class="stat">
          <div class="k">Quality</div>
          <div class="opt-group" id="qualitySelect">
            <button class="opt" data-value="standard">Standard</button>
            <button class="opt active" data-value="high">High</button>
            <button class="opt" data-value="ultra">Ultra</button>
          </div>
        </div>
        <div class="stat audio-row">
          <div>
            <div class="k">Audio</div>
            <div class="v" id="audioLabel">Off</div>
          </div>
          <label class="switch" title="Toggle audio recording">
            <input type="checkbox" id="audioToggle">
            <span class="slider"></span>
          </label>
        </div>
        <div class="stat"><div class="k">Output</div><div class="v" id="savePath">Downloads</div></div>
      </div>
    </div>

    <div class="foot">
      <div class="credit rainbow">© 2026 Candle. All rights reserved.</div>
    </div>
  </div>

<script>
let poll = null;
const $ = id => document.getElementById(id);

function winCtrl(action) { fetch('/win/' + action).catch(()=>{}); }
const dragRegion = document.getElementById('dragRegion');
dragRegion.addEventListener('mousedown', (e) => {
  if (e.button !== 0) return;
  fetch('/win/drag?x=' + e.screenX + '&y=' + e.screenY).catch(()=>{});
});
dragRegion.addEventListener('dblclick', () => winCtrl('maximize'));

function audioEnabled() { return $('audioToggle').checked; }
function updateAudioLabel() {
  $('audioLabel').textContent = audioEnabled() ? 'On' : 'Off';
}
$('audioToggle').addEventListener('change', updateAudioLabel);
updateAudioLabel();

function optValue(id) {
  const el = document.querySelector('#' + id + ' .opt.active');
  return el ? el.dataset.value : '';
}
function setOptsDisabled(id, on) {
  document.querySelectorAll('#' + id + ' .opt').forEach(b => b.disabled = on);
}
document.querySelectorAll('.opt-group').forEach(group => {
  group.addEventListener('click', (e) => {
    const btn = e.target.closest('.opt');
    if (!btn || btn.disabled) return;
    group.querySelectorAll('.opt').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  });
});

function setRecording(on) {
  $('recordPanel').classList.toggle('recording', on);
  $('startBtn').disabled = on;
  $('stopBtn').disabled = !on;
  $('audioToggle').disabled = on;
  setOptsDisabled('resolutionSelect', on);
  setOptsDisabled('qualitySelect', on);
  $('timerSub').textContent = on ? 'Recording' : 'Ready';
  $('sideStatus').textContent = on ? 'Recording' : 'Idle';
  $('sideStatus').className = 'v' + (on ? '' : '');
}
function setStatus(msg, cls='') {
  const el = $('status');
  el.textContent = msg;
  el.className = 'status ' + cls;
}
function fmt(sec) {
  sec = Math.max(0, Math.floor(sec));
  const m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}
async function api(path) {
  const r = await fetch(path, {cache:'no-store'});
  return r.json();
}
async function startRec() {
  $('startBtn').disabled = true;
  setStatus('Starting...');
  try { new Audio('/start.mp3').play().catch(()=>{}); } catch(e) {}
  try {
    const q = optValue('qualitySelect');
    const r = optValue('resolutionSelect');
    const d = await api('/start?audio=' + (audioEnabled() ? '1' : '0') + '&quality=' + encodeURIComponent(q) + '&resolution=' + encodeURIComponent(r));
    if (d.ok) {
      setRecording(true);
      setStatus(audioEnabled() ? 'Recording your screen with audio.' : 'Recording your screen.');
      if (poll) clearInterval(poll);
      poll = setInterval(sync, 500);
    } else {
      $('startBtn').disabled = false;
      setStatus(d.error || 'Could not start recording.', 'err');
    }
  } catch(e) {
    $('startBtn').disabled = false;
    setStatus('Could not start recording.', 'err');
  }
}
async function stopRec() {
  $('stopBtn').disabled = true;
  setStatus('Saving your recording...');
  try { await api('/stop'); } catch(e) {}
  setTimeout(sync, 300);
  setTimeout(sync, 1200);
}
async function openDownloads() { try { await api('/open-downloads'); } catch(e){} }
async function sync() {
  try {
    const d = await api('/status');
    $('timer').textContent = fmt(d.elapsed || 0);
    if (d.path) $('savePath').textContent = d.path;
    if (d.recording) {
      setRecording(true);
      setStatus('Recording your screen.');
    } else {
      setRecording(false);
      if (poll) { clearInterval(poll); poll = null; }
      if (d.error) {
        setStatus(d.error, 'err');
        $('sideStatus').textContent = 'Error';
        $('sideStatus').className = 'v';
      } else {
        setStatus('Your screen is ready to record.');
        $('sideStatus').textContent = 'Idle';
        $('sideStatus').className = 'v';
      }
    }
  } catch(e) {}
}
sync();
</script>
</body>
</html>
